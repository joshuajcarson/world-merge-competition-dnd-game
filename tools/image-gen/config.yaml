# Local Forge connection + generation defaults. Edit this file directly —
# nothing in here is secret, it's all local-machine settings. See
# tools/image-gen/README.md for the full setup walkthrough.

forge:
  # Default Forge/A1111 API address when running on the same machine.
  base_url: "http://127.0.0.1:7860"

# Used by generate_npc_portrait.py — NPC/race token portraits.
# No LoRA by default; the "Glitch-Corrupted Render" style (see
# .claude/skills/campaign-chronicle/references/monster-art-style.md) is
# carried entirely by the prompt text already written into each file's
# Token Prompt block.
portrait:
  checkpoint: "sd_xl_base_1.0.safetensors"
  lora: null   # or: {name: "some_character_lora", weight: 0.8}
  width: 1024
  height: 1024
  steps: 30
  cfg_scale: 7
  sampler_name: "DPM++ 2M Karras"
  negative_prompt: "blurry, low quality, extra limbs, deformed hands, watermark, text, signature, photo border, frame"

# Used by generate_battlemap.py — encounter battlemaps.
# Fill in `lora.name` once you've downloaded a battlemap LoRA for SDXL and
# dropped it into Forge's models/Lora folder; set trigger_words from that
# LoRA's model card (civitai page, usually).
battlemap:
  checkpoint: "sd_xl_base_1.0.safetensors"
  lora:
    name: "dnd_battlemap_sdxl"
    weight: 0.8
    trigger_words: "top-down battlemap, dnd map"  # fill in from the LoRA's own documentation
  # Appended to every battlemap prompt, after the node's own Battlemap Prompt. Keeps
  # maps from coming out bland without hard-coding what appears in them: it asks for
  # variety and points of interest, and the model picks the specifics each time.
  # Set to "" to turn it off.
  extra_detail: >-
    Visually rich and varied rather than sparse or empty: several distinct points of
    interest scattered across the map, each different from the others - flowering or
    blooming trees, unusual and interestingly shaped rocks, fallen timber with moss,
    fungus or climbing plants growing on it, small clusters of plants and wildflowers,
    varied ground textures.
  generate_width: 1216
  generate_height: 832
  steps: 30
  cfg_scale: 7
  sampler_name: "DPM++ 2M Karras"
  negative_prompt: "blurry, low quality, watermark, text, signature, characters, miniatures, UI, grid labels, perspective view, angled view, isometric, horizon, sky, aerial photograph, 3d render, photo, parchment, scroll, border, frame, legend, compass, world map, text labels"
  # Upscale pass, to land near Roll20-friendly sizes.
  upscaler: "4x-UltraSharp"
  # Upscale is not cropped: the result matches target_height and the width follows
  # the generated aspect ratio (about 1528x1048 from a 1216x832 generation).
  target_width: 1400
  target_height: 1050
