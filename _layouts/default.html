<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📡</text></svg>">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">📡</span>
        <span>
          <strong>{{ site.title }}</strong>
          <em>{{ site.tagline }}</em>
        </span>
      </a>
      <nav aria-label="Main">
        <a href="{{ '/world/' | relative_url }}">The World</a>
        <a href="{{ '/sessions/' | relative_url }}">Sessions</a>
        <a href="{{ '/items/' | relative_url }}">Items</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Broadcast feed for the 23rd Cohort. Contestant-visible material only.</p>
    </div>
  </footer>
</body>
</html>
